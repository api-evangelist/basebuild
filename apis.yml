name: Basebuild
description: Basebuild Labs, Inc. builds Beams, an AI project manager for construction and real estate teams.
  The product automatically transcribes project meetings, tracks decisions and action items, and assembles a
  searchable knowledge base from those discussions, capturing information without requiring a bot to join the
  call. It is aimed at giving construction and real estate project teams real-time visibility and control over
  teams, projects, budgets, and finances. Basebuild is an early-stage Canaan Partners portfolio company based
  in Santa Monica, California, and this API Evangelist profile tracks its public-facing surface. As of this
  enrichment pass the company publishes a marketing site and a product login only, with no public API,
  developer portal, OpenAPI definition, or documentation surface to catalog.
